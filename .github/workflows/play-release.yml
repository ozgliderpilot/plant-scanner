name: Play release
run-name: "Play release ${{ inputs.version_name }} (${{ inputs.version_code }})"

# Builds a signed prod AAB and deploys it to Play Internal testing (not production).
# VERSION_CODE / VERSION_NAME are baked into the AAB and shown on the History screen.

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: Play versionCode (must increase on every Play upload)
        required: true
        type: string
      version_name:
        description: Play versionName (e.g. 1.0.1)
        required: true
        type: string
        default: "1.0.0"

concurrency:
  group: play-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-36 build-tools;35.0.0 platform-tools

      - name: Decode upload keystore
        env:
          PLAY_UPLOAD_KEYSTORE_BASE64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -z "${PLAY_UPLOAD_KEYSTORE_BASE64}" ]; then
            echo "Missing secret PLAY_UPLOAD_KEYSTORE_BASE64. See docs/deploy/play.md."
            exit 1
          fi
          echo "$PLAY_UPLOAD_KEYSTORE_BASE64" | base64 -d > upload-keystore.jks

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Bundle prod release AAB
        env:
          VERSION_CODE: ${{ inputs.version_code }}
          VERSION_NAME: ${{ inputs.version_name }}
          PLAY_UPLOAD_STORE_FILE: ${{ github.workspace }}/upload-keystore.jks
          PLAY_UPLOAD_STORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_STORE_PASSWORD }}
          PLAY_UPLOAD_KEY_ALIAS: ${{ secrets.PLAY_UPLOAD_KEY_ALIAS }}
          PLAY_UPLOAD_KEY_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEY_PASSWORD }}
        run: |
          if [ -z "$PLAY_UPLOAD_STORE_PASSWORD" ] || [ -z "$PLAY_UPLOAD_KEY_ALIAS" ] || [ -z "$PLAY_UPLOAD_KEY_PASSWORD" ]; then
            echo "Missing Play upload signing secrets. See docs/deploy/play.md."
            exit 1
          fi
          ./gradlew :app:bundleProdRelease --stacktrace

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: nursery-prod-release-${{ inputs.version_name }}-${{ inputs.version_code }}
          path: app/build/outputs/bundle/prodRelease/app-prod-release.aab
          retention-days: 30

      - name: Deploy to Play Internal testing
        # Pin to full commit SHA — mutable tags can be retargeted (Play creds in this step).
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.nursery.scanner
          releaseFiles: app/build/outputs/bundle/prodRelease/app-prod-release.aab
          tracks: internal
          status: completed
